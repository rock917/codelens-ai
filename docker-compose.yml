version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codelens-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CodeLens AI
      - DEBUG=False
      - DATABASE_URL=sqlite+aiosqlite:///./codelens.db
      - CHROMA_PERSIST_DIR=./chroma_db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - MAX_UPLOAD_SIZE_MB=100
      - UPLOAD_DIR=./uploads
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - backend_db:/app/codelens.db
      - backend_uploads:/app/uploads
      - backend_chroma:/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codelens-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_db:
  backend_uploads:
  backend_chroma: