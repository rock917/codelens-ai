name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Create .env
        working-directory: backend
        run: |
          echo "GROQ_API_KEY=test" > .env
          echo "DATABASE_URL=sqlite+aiosqlite:///./test.db" >> .env
          echo "CHROMA_PERSIST_DIR=./test_chroma" >> .env
          echo "EMBEDDING_MODEL=all-MiniLM-L6-v2" >> .env
          echo "UPLOAD_DIR=./test_uploads" >> .env
          echo "FRONTEND_URL=http://localhost:5173" >> .env

      - name: Import checks
        working-directory: backend
        run: python -c "from main import app; print('✅ Backend OK')"

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  success:
    name: All Checks Passed
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "✅ All CI checks passed!"