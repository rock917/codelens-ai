# For one Azure Linux VM, using its managed disk (not /mnt temporary storage).
# Keep Supabase as the SQL database. Supply secrets on the host, never in Git.
name: codelens
services:
  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Supply the Supabase connection URL securely}
      GROQ_API_KEY: ${GROQ_API_KEY:?Supply the Groq key securely}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      FRONTEND_URL: https://codelens-ai-five.vercel.app
      DEBUG: "false"
      USE_GPU: "false"
      UPLOAD_DIR: /data/uploads
      CHROMA_PERSIST_DIR: /data/chroma
      HF_HOME: /data/huggingface
      EMBEDDING_CPU_THREADS: "2"
      EMBEDDING_WRITE_BATCH_SIZE: "32"
      RECOVER_INTERRUPTED_JOBS: "true"
    volumes:
      - codelens_data:/data
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  codelens_data:
